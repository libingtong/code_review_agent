workspace: .

# ============================== 渠道 ==============================
# 没有全局 openai 段了：每个渠道自带 endpoint / key / 模型 / 上下文，
# 谁生效一目了然，也不会出现"模型名到底从哪来的"。
providers:
  - id: minimax
    label: MiniMax M Plan
    vendor: minimax           # 探测方式/额度单位由 vendor 决定
    plan: minimax-mplan       # 额度单位与容量：percent, 100
    enabled: true
    weight: 2
    openai:
      # MiniMax 也支持 Responses（/v1/responses）：原生 tool_choice + 续接
      api_interface: responses
      base_url: https://api.minimax.cn/v1
      api_key: ""
      api_key_env: MINIMAX_API_KEY
      model: MiniMax-M3.1-Flash
      thinking:
        type: adaptive
      reasoning_effort: max
      temperature: 1
      top_p: 1
      max_context_tokens: 200000
      max_output_tokens: 65536
      timeout_seconds: 120
      stream: true

  - id: glm
    label: GLM Coding Plan
    vendor: glm
    plan: glm-max             # lite=2000 / pro=12000 / max=28000 积分每 5 小时
    enabled: true
    weight: 1
    openai:
      # 必须用「个人编程套餐」里新建的 key，与标准 API key 不通用
      # GLM 的 Responses 端点；也支持 /api/coding/paas/v4 的 Chat Completions。
      # 注意：GLM 会返回 response id 但拒绝 previous_response_id，客户端会自动降级为全量历史。
      api_interface: responses
      # GLM 反复以 invalid_request 拒绝回放 function_call 历史，因此固定用文本历史
      # （工具结果以文字形式回放，模型仍用原生 function call 调用工具）。
      history: text
      base_url: https://open.bigmodel.cn/api/v1
      api_key: ""
      api_key_env: GLM_API_KEY
      # flash 在长工具上下文里会退化（把工具调用写成散文、输出预算全烧在 reasoning 上），
      # 这里用完整版 glm-5.3；若报"找不到模型"，用 -check 查看该端点可用模型。
      model: glm-5.3
      thinking:
        type: enabled
      # high/max 在 glm-5.3 上单次生成可能超过 90s，且更容易撞 max_output_tokens
      reasoning_effort: high
      temperature: 1
      top_p: 1
      max_context_tokens: 200000
      max_output_tokens: 65536
      timeout_seconds: 300
      stream: true
    quota:
      min_headroom: 0.10
      max_usage_ratio: 0.9
    schedule:
      enabled: false          # 本渠道忽略全局时段，全天可用

  # 例子：同厂商第二个渠道（另一份套餐或另一个 key），额度独立计算
  # - id: glm-lite
  #   label: GLM Lite（小额度，跑轻任务）
  #   vendor: glm
  #   plan: glm-lite
  #   weight: 1
  #   openai:
  #     api_interface: chat
  #     base_url: https://open.bigmodel.cn/api/coding/paas/v4
  #     api_key_env: GLM_LITE_API_KEY
  #     model: glm-5.3
  #     max_context_tokens: 200000
  #     max_output_tokens: 65536

# 5 小时窗口状态与自设上限的落盘位置（重启不会把半个窗口当成满额）
quota:
  state_file: state/quota.json
  limits_file: state/limits.json

routing:
  switch_below: 0.15        # 当前源余量低于 15% 才换，保护上游缓存命中
  min_dwell_seconds: 300    # 最短驻留 5 分钟，避免来回抖动
  prefer: sticky

# 频繁 429 说明并发超过套餐允许：每次 429 把该源并发减半，连续成功再慢慢加回。
concurrency:
  max_in_flight: 5          # GLM 当前稳定上限；避免自适应反复升到 10 后触发 429
  initial_in_flight: 4
  min_in_flight: 1
  increase_after_successes: 20
  increase_step: 1
  decrease_factor: 0.5
  increase_cooldown_seconds: 120
  learn: true               # 稳定后把并发记住（state/concurrency.json），下次启动直接沿用
  pin: false                # true = 固定在学习值，不再向上试探
  settle_successes: 40      # 连续 40 次成功且没被限流，就认为当前并发是稳定的

# 工作时间段（全局）：enabled 改成 true 就生效（窗口外暂停，到点自动恢复）。
# 渠道可以用 providers[].schedule 覆盖它，例如上面的 glm 是全天可用。
# /window 可在界面里改，改动写入 state/schedule.json 并优先于这里。
schedule:
  enabled: true
  timezone: Asia/Shanghai
  store_file: state/schedule.json
  windows:
    - start: "21:00"        # 跨午夜：21:00 到次日 08:00
      end: "08:00"
      days: [mon, tue, wed, thu, fri, sat, sun]
  on_window_close: pause
  poll_seconds: 30

# 诊断日志：默认关闭。排查厂商协议差异时打开，并把 llm_dump 打开即可拿到失败请求
logging:
  enabled: true
  level: info            # debug | info | warn | error | off
  dir: logs
  max_size_mb: 32
  keep_files: 5
  llm_dump: true        # true = 失败请求的完整（已脱敏）payload 落到 logs/dumps/

orchestrator:
  enabled: true
  task_file: tasks.yaml
  state_file: orchestrator/state.json
  report_dir: reports
  session_dir: sessions/tasks
  continue_on_failure: true
  retries: 1

prompts:
  system: prompts/system.md
  compress: prompts/compress.md
  skills_dir: skills
  templates_dir: prompts/templates

agent:
  recon_agents: 4
  #这边拉的越大效果越好,建议deepseek 32个以上,但是token也很多
  audit_agents: 12
  forum_wait_seconds: 60
  # 无限模式：禁止模型结束审计；时间或 token 任一耗尽即停止。
  # 时间合计为 0、token 为 0 分别表示不限；两项均为 0 则无限。
  infinite_mode: true
  budget_hours: 3
  budget_minutes: 0
  budget_tokens: 0
  max_turns: 0
  # 侦察阶段回合上限（无限模式下也生效）：超限先提醒"立即 audit_plan_done"，再 5 回合未提交就停掉该成员
  max_turns_per_stage: 90
  # 审计阶段多少回合后仍没认领任何文件，就只允许读码/认领类工具（防止一直在论坛聊天）
  audit_nudge_turns: 60
  # 侦察交接至少给出这么多待审文件（第一轮 36 个文件 → 5 个漏洞，后来的 5 个文件 → 0 个）
  min_audit_files: 8
  session_dir: sessions
  log_session: false
  log_session_dir: log_sessions
  retry_attempts: 3
  # 一回合最多执行几个工具调用：1 = 严格逐个（旧行为）；2-3 = 允许模型批量只读调用，
  # 系统依次执行后统一返回结果（吞吐更高，偶有猜测调用）。
  max_tools_per_turn: 3
  # 每回合都要重发历史（GLM 不支持续接），0.70 意味着最高 70 万 token 反复重发，
  # 几十分钟就能烧掉一个 5 小时套餐。压到 0.35，并靠摘要压缩控制体积。
  compress_at_ratio: 0.55
  # 必须 <= 最紧源(GLM 200k ctx / 65k out)的 context-output 差额，否则压缩阈值无解
  compress_buffer_tokens: 32768
  auto_plan: true
  max_tool_result_chars: 12000
  moderator_enabled: true
  moderator_interval_seconds: 60
